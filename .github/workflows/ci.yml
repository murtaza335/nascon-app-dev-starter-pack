# Mirror only. The official autograder workflow may differ: read the spec's submission contract first.
name: ci

on:
  push:
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start compose stack
        run: docker compose up --build -d --wait
      - name: Wait for health
        run: ./scripts/wait-for-health.sh http://localhost:3000/health 90
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: API tests
        run: pytest -c tests/pytest.ini tests/api
      # - name: Web smoke tests
      #   run: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile ui up -d --wait && pytest -c tests/pytest.ini tests/e2e-web
      # - name: Perf smoke
      #   run: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile perf run --rm k6
      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > reports/compose.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
      - name: Tear down
        if: always()
        run: docker compose down -v
